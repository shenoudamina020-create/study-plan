<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="vKWfJbN0vYdaLwBEC59YB9E324aBmtskzjwwPIHq1Y">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>study plan-Shenouda Mina</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- الهيدر -->
  <header class="bg-teal-600 text-white p-4 shadow-md text-center">
    <h1 class="text-2xl font-bold"><i class="fas fa-graduation-cap ml-2"></i> خطة الدراسة (12 ساعة أسبوعياً)</h1>
  </header>

  <!-- محتوى التطبيق -->
  <main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col justify-center">
    
    <!-- بطاقة العداد والتقدم -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center space-y-6">
      <h2 class="text-xl font-bold text-teal-700">ساعات الإنجاز الأسبوعية</h2>
      
      <!-- عداد الساعات المنجزة -->
      <div class="flex justify-center items-baseline gap-2">
        <span id="hoursCount" class="text-5xl font-black text-slate-800">0</span>
        <span class="text-xl text-slate-500">/ 12 ساعة</span>
      </div>

      <!-- شريط التقدم -->
      <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-teal-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- أزرار التحكم -->
      <div class="flex gap-3 pt-2">
        <button onclick="addHour()" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white py-3 px-4 rounded-xl font-bold shadow transition flex items-center justify-center gap-2">
          <i class="fas fa-plus"></i> تسجيل ساعة
        </button>
        <button onclick="resetProgress()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 py-3 px-4 rounded-xl font-bold transition flex items-center justify-center" title="إعادة تعيين">
          <i class="fas fa-redo"></i>
        </button>
      </div>
    </div>

  </main>

  <!-- الفوتر -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
    تم التطوير بواسطة Shenouda Mina &copy; 2026
  </footer>

  <!-- جافا سكريبت لحفظ البيانات وتحويل التطبيق -->
  <script>
    // استرجاع الساعات المخزنة عند فتح التطبيق
    let completedHours = localStorage.getItem('study_hours') ? parseInt(localStorage.getItem('study_hours')) : 0;
    updateUI();

    function addHour() {
      if (completedHours < 12) {
        completedHours++;
        localStorage.setItem('study_hours', completedHours);
        updateUI();
      }
    }

    function resetProgress() {
      if (confirm('هل أنت متأكد من تصفير العداد وبدء أسبوع جديد؟')) {
        completedHours = 0;
        localStorage.setItem('study_hours', completedHours);
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('hoursCount').innerText = completedHours;
      let percentage = (completedHours / 12) * 100;
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    // تفعيل الـ Service Worker لضمان العمل كـ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered! scope:', reg.scope))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }
  </script>

</body>
</html>
